# ============================================================
# Base config for classic (Yamauchi 1997) frontier exploration.
# Scene-specific configs inherit from this via:
#   _base: ../../base_classic_exploration.yaml
# ============================================================

# ------ FrontierNet Model (unused for classic, kept for compatibility) ------
df_normalizer: 10
df_thr: 0.3
num_classes: 7
input_img_size: [320, 320]
focal_length: 300.0

# ------ Frontier Manager ------
filter_not_in_freespace: true               # remove frontiers not in the free voxel map; safe only in voxel_grid mode
freespace_filter_dist: 3.0
nav_path_filter_radius: 0.1
filter_max_vd_z: 0.65
force_all_frontier_to_xy: False
filter_min_gain: 1

visited_trans_threshold: 0.25
visited_angle_threshold: 0.4
visited_gain_reduction_factor: 2000

detr_visited_gain_reduction_factor: 0.2
detr_visited_dist_threshold: 1.0
detr_max_n_close: 5

max_active_frontiers: 20
graveyard_radius: 0.4                      # halved vs DETR (0.8): classic re-detects from live wavemap
detection_graveyard_radius: 0.3

utility_gain_factor: 1.0
utility_dist_exponent: 1.5
min_utility_dist: 0.5

render_K: [60.0, 0.0, 64.0, 0.0, 60.0, 64.0, 0.0, 0.0, 1.0]
render_H: 128
render_W: 128
render_d_range: 3.5
render_decrease_factor: 1.0

# ------ Mapping ------
voxel_size: 0.1
depth_range: 3.5

# ------ Planning ------
use_free_grid: True
use_occ_grid: True
min_dist2occ: 0.2
max_dist2free: 0.15
max_planning_time: 5.0
planning_algo: rrtconnect
path_visit_penalty_radius: 0.5
path_visit_penalty_weight: 1.0

# ------ Exploration App ------
predict_interval: 6
plan_interval: 15
