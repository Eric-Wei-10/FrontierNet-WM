# ============================================================
# Universal base config for DETR-based FrontierNet exploration
# Scene-specific configs inherit from this via:
#   _base: ../../base_detr_exploration.yaml
# ============================================================

# ------ FrontierNet Model ------
df_normalizer: 10
df_thr: 0.3
num_classes: 7
input_img_size: [320, 320]
focal_length: 300.0

# ------ Frontier Manager ------
filter_max_vd_z: 0.65                       # max |vd_z| of viewing direction unit vector
force_all_frontier_to_xy: False
filter_min_gain: 10                         # GMM weights sum to ~1 over 20 slots (mean≈0.05); with gain_scale=100 this requires weight>0.10 — keeps only above-average slots

visited_trans_threshold: 0.25              # translational threshold for "visited" check (classic unet frontiers)
visited_angle_threshold: 0.4
visited_gain_reduction_factor: 2000

detr_visited_gain_reduction_factor: 0.2    # multiplicative u_gain decay per close robot pose
detr_visited_dist_threshold: 1.0           # robot pose within this distance (m) counts as "close"
detr_max_n_close: 5                        # retire frontier after this many close robot poses

max_active_frontiers: 20                   # hard cap; lowest-utility retired first
graveyard_radius: 0.8                      # planning-failure / stuck exclusion radius (m)

utility_gain_factor: 1.0
utility_dist_exponent: 1.5                 # distance penalty exponent (1.0=linear, >1=prefer nearby)
min_utility_dist: 0.5                      # distance floor in utility denominator (m)

render_K: [60.0, 0.0, 64.0, 0.0, 60.0, 64.0, 0.0, 0.0, 1.0]
render_H: 128
render_W: 128
render_d_range: 3.5
render_decrease_factor: 1.0

# ------ Mapping ------
voxel_size: 0.1
depth_range: 3.5

# ------ Planning ------
use_free_grid: True
use_occ_grid: True
min_dist2occ: 0.2
max_dist2free: 0.15
max_planning_time: 5.0
planning_algo: rrtconnect
path_visit_penalty_radius: 0.5
path_visit_penalty_weight: 1.0             # only active when planning_algo: rrtstar

# ------ Exploration App ------
predict_interval: 6
detect_interval: 5
