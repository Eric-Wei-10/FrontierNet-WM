# ============================================================
# Base config for MapEx-based FrontierNet exploration.
# Scene-specific configs inherit from this via:
#   _base: ../../base_mapex_exploration.yaml
#
# MapEx uses a LaMa inpainting ensemble to predict the 2-D
# top-down occupancy map; frontier gain = ensemble variance.
# Planning and navigation are identical to the DETR pipeline.
# ============================================================

# ------ FrontierNet Model (unused for mapex, kept for compatibility) ------
df_normalizer: 10
df_thr: 0.3
num_classes: 7
input_img_size: [320, 320]
focal_length: 300.0

# ------ Frontier Manager ------
filter_max_vd_z: 0.9                        # MapEx frontiers are 2-D lifts; relax z-direction filter
force_all_frontier_to_xy: false
filter_min_gain: 1                          # LaMa variance × 1e4 easily exceeds this

visited_trans_threshold: 0.25
visited_angle_threshold: 0.4
visited_gain_reduction_factor: 2000

detr_visited_gain_reduction_factor: 0.7    # 0.2 was too aggressive: nearby frontiers killed at step 0
detr_visited_dist_threshold: 1.0           # 1.5 was too large: start pose penalised frontiers 1.5 m away
detr_max_n_close: 5

max_active_frontiers: 20
graveyard_radius: 0.8

utility_gain_factor: 1.0
utility_dist_exponent: 1.5
min_utility_dist: 0.5

render_K: [60.0, 0.0, 64.0, 0.0, 60.0, 64.0, 0.0, 0.0, 1.0]
render_H: 128
render_W: 128
render_d_range: 3.5
render_decrease_factor: 1.0

# ------ Mapping ------
voxel_size: 0.1
depth_range: 3.5

# ------ Planning ------
use_free_grid: true
use_occ_grid: true
min_dist2occ: 0.2
max_dist2free: 0.15
max_planning_time: 5.0
planning_algo: rrtconnect
path_visit_penalty_radius: 0.5
path_visit_penalty_weight: 1.0

# ------ Exploration App ------
# LaMa inference takes ~0.1 s/call; detect every 5 steps so new frontiers appear before reaching current goal.
predict_interval: 6
detect_interval: 5
