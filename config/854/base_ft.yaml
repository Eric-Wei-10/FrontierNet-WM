_base: ../base_wm_exploration.yaml

# Fine-tune variant: higher collision tolerance, disabled invalid voxels, multi-step moves
weight_threshold: 3
vd_z_threshold: 0.8
trans_threshold: 0.35
use_mono_depth: False
planner_collision_radius: 0.06
use_invalid_voxel: False
max_planning_time: 5.0
predict_step_interval: 10
num_steps_per_move: 30

bbox:
  - [-20, 20, -20, 20, -0.85, 3.75]
planner_bbox:
  - [-20, 20, -20, 20, -0.85, 3.75]

