# ============================================================
# Universal base config for UNet-based FrontierNet baseline exploration.
# Scene-specific configs inherit from this via:
#   _base: ../../base_baseline_exploration.yaml
# ============================================================

# ------ FrontierNet UNet Model ------
df_normalizer: 10
df_thr: 0.3
num_classes: 11
input_img_size: [544, 720]
focal_length: 300.0

# ------ Frontier Manager ------
filter_max_vd_z: 0.65
force_all_frontier_to_xy: False
filter_min_gain: 1

visited_trans_threshold: 0.5
visited_angle_threshold: 0.4
visited_gain_reduction_factor: 2000
utility_gain_factor: 1.0

render_K: [60.0, 0.0, 64.0, 0.0, 60.0, 64.0, 0.0, 0.0, 1.0]
render_H: 128 
render_W: 128
render_d_range: 3.5
render_decrease_factor: 1.0

# ------ Mapping ------
voxel_size: 0.1
depth_range: 3.5

# ------ Planning ------
use_free_grid: True
use_occ_grid: True
min_dist2occ: 0.2
max_dist2free: 0.075
filter_not_in_freespace: true
freespace_filter_dist: 1.5                 # DETR frontiers land at occluded surfaces; 1.5 m lets valid
                                           # boundary frontiers pass while wall/exterior ones are rejected
max_planning_time: 1.5
planning_algo: rrtstar


# ------ Exploration App ------
predict_interval: 6
plan_interval: 15